<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Mario Run</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <h1>Mini Mario Run</h1>

      <div class="hud" aria-live="polite">
        <div class="stat">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="stat">
          <span>Lives</span>
          <strong id="lives">3</strong>
        </div>
        <div class="stat">
          <span>Time</span>
          <strong id="time">120</strong>
        </div>
      </div>

      <canvas id="game" width="960" height="540" aria-label="Mini Mario Game Canvas"></canvas>

      <div id="message" class="message">Use ← → to run and ↑ / Space to jump.</div>
      <button id="restartButton" type="button">Restart</button>
    </main>

    <script src="game.js"></script>
  </body>
</html>
